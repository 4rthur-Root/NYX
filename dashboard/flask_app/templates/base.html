<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NyxSOC Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="{{ url_for('metrics.metrics_index') }}">NyxSOC</a>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('metrics.metrics_index') }}" class="{% if request.endpoint == 'metrics.metrics_index' %}active{% endif %}">Métriques</a></li>
            <li><a href="{{ url_for('alerts.alerts_index') }}" class="{% if request.endpoint and request.endpoint.startswith('alerts.') %}active{% endif %}">Alertes</a></li>
            <li><a href="{{ url_for('responses.responses_index') }}" class="{% if request.endpoint and request.endpoint.startswith('responses.') %}active{% endif %}">Réponses</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>NyxSOC — Mini-SOC pour PME togolaises</p>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
