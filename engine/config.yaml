sources:
  "srv-pme.log":             "syslog"
  "localhost.log":           "web"
  "OPNsense.internal.log":   "filterlog"
  "NYX-PME.nyx.tg.log":      "windows"

# Résolution hostname -> IP statique de la topologie NyxSOC.
# Utilisé par RuleEngine pour renseigner target_ip dans les alertes
# (Option C - cf. engine.md : mapping connu en priorité, null en
# fallback si un source_host n'y figure pas plutôt qu'une IP inventée).
hosts:
  "srv-pme":               "10.0.1.20"
  "srv-pme.nyx.tg":        "10.0.1.20"
  "debian-server":         "10.0.1.20"
  "NYX-PME":               "10.0.1.30"
  "NYX-PME.nyx.tg":        "10.0.1.30"
  "OPNsense.internal":     "10.0.1.1"
  "localhost":             "10.0.1.20"   # Dolibarr tourne en Docker sur srv-pme

# Rétention des données SQLite
retention:
  events_hours: 24
  context_cleanup_interval_seconds: 3600

# Queue en mémoire reader → dispatcher
queue:
  maxsize: 10000

# Chemins filesystem
log_dir:    "/var/log/remote"
db_path:    "engine/engine.db"
alerts_dir: "/var/log/nyxsoc/alerts"
alerts_log: "/var/log/nyxsoc/engine.log"

samba_mounts:
  commun:        "/mnt/samba/commun"
  direction:     "/mnt/samba/direction"
  comptabilite:  "/mnt/samba/comptabilite"
  technique:     "/mnt/samba/technique"

# Canal de communication vers le module SOAR
soar:
  channel: "file"
  alerts_dir: "/var/log/nyxsoc/alerts"

# Chemins vers les règles de détection
rules:
  attack: "engine/rules/attack"

